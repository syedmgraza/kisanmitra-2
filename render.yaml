services:
  - type: web
    name: kisanmitra
    runtime: docker
    rootDir: spring-backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: ML_SERVICE_URL
        value: https://kisanmitra-ml.onrender.com
      - key: ML_SERVICE_API_KEY
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: kisanmitra-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: kisanmitra-db
          property: password
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: DB_HOST
        fromDatabase:
          name: kisanmitra-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kisanmitra-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: kisanmitra-db
          property: database
      - key: PLANT_HEALTH_API_URL
        value: https://planthealthengine.com/api/v1/diagnose
      - key: PLANT_HEALTH_API_KEY
        sync: false

  - type: web
    name: kisanmitra-ml
    runtime: docker
    rootDir: ml-service
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ML_SERVICE_API_KEY
        fromService:
          name: kisanmitra
          type: web
          envVarKey: ML_SERVICE_API_KEY

databases:
  - name: kisanmitra-db
    databaseName: kisanmitra
    user: kisanmitra
    plan: free
    region: singapore
