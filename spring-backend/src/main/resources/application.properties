spring.application.name=kisanmitra
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:kisanmitra;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.servlet.multipart.max-file-size=7MB
spring.servlet.multipart.max-request-size=8MB
ml.service-url=${ML_SERVICE_URL:http://localhost:8000}
ml.service-api-key=${ML_SERVICE_API_KEY:}
plant-health.api-url=${PLANT_HEALTH_API_URL:https://planthealthengine.com/api/v1/diagnose}
plant-health.api-key=${PLANT_HEALTH_API_KEY:}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
