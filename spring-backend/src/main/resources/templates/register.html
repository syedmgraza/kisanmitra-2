<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · KisanMitra</title><link rel="stylesheet" href="/css/app.css"><script src="https://unpkg.com/lucide@latest"></script></head><body class="auth-page"><main class="auth-shell"><a class="brand auth-brand" href="/login"><img src="/assets/logo.png" alt=""><span>Kisan<span class="brand-accent">Mitra</span></span></a><section class="auth-card auth-card-wide"><p class="eyebrow">LET'S GET TO KNOW YOUR FARM</p><h1>Create your account</h1><p class="muted">Your location and land details help tailor crop guidance.</p><div class="notice error" th:if="${registrationError}" th:text="${registrationError}"></div><form method="post" action="/register" th:object="${farmer}" class="form-grid"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="span-2">Your name<input th:field="*{username}" autocomplete="name" required maxlength="80" placeholder="e.g. Asha Patel"><small class="field-error" th:errors="*{username}"></small></label><label class="span-2">Email address<input type="email" th:field="*{email}" autocomplete="email" required placeholder="you@example.com"><small class="field-error" th:errors="*{email}"></small></label><label class="span-2">Password<input type="password" name="passwordHash" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"><small class="field-error" th:errors="*{passwordHash}"></small></label><label>State<select th:field="*{state}" required><option value="">Choose your state</option><option th:each="s : ${states}" th:value="${s}" th:text="${s}"></option></select></label><label>District<input th:field="*{district}" required placeholder="Your district" maxlength="80"></label><label class="span-2">Cultivated land (hectares)<input type="number" th:field="*{landSizeHectares}" min="0.01" max="10000" step="0.01" required placeholder="e.g. 2.5"><small class="field-error" th:errors="*{landSizeHectares}"></small></label><button class="button button-primary button-wide span-2">Create account <i data-lucide="arrow-right"></i></button></form><p class="auth-switch">Already registered? <a href="/login">Sign in</a></p></section><p class="auth-foot">Your details are used to personalise your farm tools.</p></main><script>lucide.createIcons()</script></body></html>
