<!doctype html>
<html th:lang="${#locale != null ? #locale.language : 'en'}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="#{auth.register.title}">Create account · KisanMitra</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme.js" defer></script>
  <script src="/js/motion.js" defer></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    function switchLocale(lang) {
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('lang', lang);
        window.location.href = url.toString();
      } catch (e) {
        window.location.href = '?lang=' + lang;
      }
    }
  </script>
</head>
<body class="auth-page">
<main class="auth-shell">
  <div class="lang-switch lang-switch-floating" role="group" th:aria-label="#{lang.switch}">
    <a href="?lang=en" th:classappend="${#locale != null and #locale.language != 'hi' ? ' active' : ''}" onclick="event.preventDefault(); switchLocale('en');">EN</a>
    <a href="?lang=hi" th:classappend="${#locale != null and #locale.language == 'hi' ? ' active' : ''}" onclick="event.preventDefault(); switchLocale('hi');">हिन्दी</a>
  </div>
  <button class="theme-toggle theme-toggle-floating" id="theme-toggle" type="button" th:aria-label="#{nav.theme.dark}" th:title="#{nav.theme.dark}"><i data-lucide="moon"></i></button>
  <a class="brand auth-brand" href="/login">
    <span class="brand-mark"><img src="/assets/logo.png" alt="KisanMitra leaf and wheat logo"></span>
    <span><span th:text="#{app.kisan}">Kisan</span><span class="brand-accent" th:text="#{app.mitra}">Mitra</span></span>
  </a>
  <section class="auth-card auth-card-wide">
    <p class="eyebrow" th:text="#{auth.register.eyebrow}">LET'S GET TO KNOW YOUR FARM</p>
    <h1 th:text="#{auth.register.heading}">Create your account</h1>
    <p class="muted" th:text="#{auth.register.subtext}">Your location and land details help tailor your crop guidance.</p>
    <div class="notice error" th:if="${registrationError}" th:text="${registrationError}"></div>
    <form method="post" action="/register" th:object="${farmer}" class="form-grid">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label class="span-2">
        <span th:text="#{auth.register.name.label}">Your name</span>
        <input th:field="*{username}" autocomplete="name" required maxlength="80" th:placeholder="#{auth.register.name.placeholder}">
        <small class="field-error" th:errors="*{username}"></small>
      </label>
      <label class="span-2">
        <span th:text="#{auth.email.label}">Email address</span>
        <input type="email" th:field="*{email}" autocomplete="email" required th:placeholder="#{auth.email.placeholder}">
        <small class="field-error" th:errors="*{email}"></small>
      </label>
      <label class="span-2">
        <span th:text="#{auth.password.label}">Password</span>
        <input type="password" name="passwordHash" autocomplete="new-password" required minlength="8" th:placeholder="#{auth.register.password.placeholder}">
        <small class="field-error" th:errors="*{passwordHash}"></small>
      </label>
      <label>
        <span th:text="#{auth.register.state.label}">State</span>
        <select id="state" th:field="*{state}" required>
          <option value="" th:text="#{auth.register.state.default}">Choose your state</option>
          <option th:each="s : ${states}" th:value="${s}" th:text="${s == 'Laddak' ? 'Ladakh' : s}"></option>
        </select>
        <small class="field-error" th:errors="*{state}"></small>
      </label>
      <label>
        <span th:text="#{auth.register.district.label}">District</span>
        <select id="district" th:field="*{district}" th:attr="data-selected=${farmer.district},data-default-text=#{auth.register.district.default},data-choose-district-text=#{register.choose_district?:'Choose your district'}" required disabled>
          <option value="" th:text="#{auth.register.district.default}">Choose a state first</option>
          <option th:each="d : ${districts}" th:value="${d}" th:text="${d}"></option>
        </select>
        <small id="district-help" class="field-help" th:text="#{auth.register.district.help}">Districts are limited to locations in the crop history data.</small>
        <small class="field-error" th:errors="*{district}"></small>
      </label>
      <label class="span-2">
        <span th:text="#{auth.register.land.label}">Cultivated land (hectares)</span>
        <input type="number" th:field="*{landSizeHectares}" min="0.01" max="10000" step="0.01" required th:placeholder="#{auth.register.land.placeholder}">
        <small class="field-error" th:errors="*{landSizeHectares}"></small>
      </label>
      <button class="button button-primary button-wide span-2" type="submit">
        <span th:text="#{auth.register.submit}">Create account</span> <i data-lucide="arrow-right"></i>
      </button>
    </form>
    <p class="auth-switch">
      <span th:text="#{auth.register.already_registered}">Already registered?</span> 
      <a href="/login" th:text="#{auth.register.sign_in}">Sign in</a>
    </p>
  </section>
  <p class="auth-foot" th:text="#{auth.register.foot}">Your details are used to personalise your farm tools.</p>
</main>
<script src="/js/register.js"></script>
<script>lucide.createIcons()</script>
</body>
</html>
