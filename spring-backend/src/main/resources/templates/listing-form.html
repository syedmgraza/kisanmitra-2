<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>List a harvest · KisanMitra</title><link rel="stylesheet" href="/css/app.css"><script src="https://unpkg.com/lucide@latest"></script></head><body><div th:replace="~{fragments/nav :: nav(${farmer},'marketplace')}"></div><main class="page-wrap narrow-wrap"><a class="back-link" href="/marketplace"><i data-lucide="arrow-left"></i> Back to marketplace</a><section class="page-intro"><p class="eyebrow">SHARE WHAT YOU'VE GROWN</p><h1>List a harvest.</h1><p>Buyers will contact you directly. Make sure your contact details are current.</p></section><form method="post" action="/marketplace/new" th:object="${listing}" class="panel form-grid"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Crop name<input th:field="*{cropName}" required maxlength="80" placeholder="e.g. Wheat"><small class="field-error" th:errors="*{cropName}"></small></label><label>Your name<input th:field="*{sellerName}" required maxlength="80"></label><label>Phone or WhatsApp<input th:field="*{sellerContact}" required maxlength="100" placeholder="+91 ..."></label><label>Available quantity (kg)<input type="number" th:field="*{quantityKg}" min="1" step="1" required></label><label>Price per kg (₹)<input type="number" th:field="*{pricePerKg}" min="0.01" step="0.01" required></label><label>State<input th:field="*{locationState}" required maxlength="80"></label><label>District<input th:field="*{locationDistrict}" required maxlength="80"></label><label class="span-2">Photo URL (optional)<input th:field="*{imagePath}" type="url" placeholder="https://..."></label><label class="span-2">Harvest details<textarea th:field="*{description}" rows="4" maxlength="1200" placeholder="Variety, harvest date, pickup details..."></textarea></label><aside class="notice market-note span-2"><i data-lucide="handshake"></i><span>KisanMitra does not handle payments. Buyers will contact you directly.</span></aside><button class="button button-primary span-2">Publish listing <i data-lucide="arrow-right"></i></button></form></main><script>lucide.createIcons()</script></body></html>
