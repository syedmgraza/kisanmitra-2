<nav class="topbar" th:fragment="nav(farmer,active)">
  <script src="/js/motion.js" defer></script>
  <script>
    function switchLocale(lang) {
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('lang', lang);
        window.location.href = url.toString();
      } catch (e) {
        window.location.href = '?lang=' + lang;
      }
    }
  </script>
  <a class="brand" href="/dashboard"><span class="brand-mark"><img src="/assets/logo.png" alt="KisanMitra leaf and wheat logo"></span><span><span th:text="#{app.kisan}">Kisan</span><span class="brand-accent" th:text="#{app.mitra}">Mitra</span></span></a>
  <div class="nav-links" aria-label="Main navigation">
    <a th:classappend="${active == 'home' ? ' active' : ''}" href="/dashboard"><span th:text="#{nav.overview}">Overview</span></a>
    <a th:classappend="${active == 'recommendation' ? ' active' : ''}" href="/recommendation"><span th:text="#{nav.crop_plan}">Crop plan</span></a>
    <a th:classappend="${active == 'tracker' ? ' active' : ''}" href="/plan"><span th:text="#{nav.field_tracker}">Field tracker</span></a>
    <a th:classappend="${active == 'yield' ? ' active' : ''}" href="/yield"><span th:text="#{nav.yield}">Yield</span></a>
    <a th:classappend="${active == 'disease' ? ' active' : ''}" href="/disease"><span th:text="#{nav.plant_health}">Plant health</span></a>
    <a th:classappend="${active == 'weather' ? ' active' : ''}" href="/weather"><span th:text="#{nav.weather}">Weather</span></a>
    <a th:classappend="${active == 'marketplace' ? ' active' : ''}" href="/marketplace"><span th:text="#{nav.marketplace}">Marketplace</span></a>
  </div>
  <div class="nav-user">
    <div class="lang-switch" role="group" th:aria-label="#{lang.switch}">
      <a href="?lang=en" th:classappend="${#locale != null and #locale.language != 'hi' ? ' active' : ''}" onclick="event.preventDefault(); switchLocale('en');">EN</a>
      <a href="?lang=hi" th:classappend="${#locale != null and #locale.language == 'hi' ? ' active' : ''}" onclick="event.preventDefault(); switchLocale('hi');">हिन्दी</a>
    </div>
    <div class="nav-profile">
      <span class="nav-avatar" aria-hidden="true" th:text="${#strings.substring(farmer.username,0,1)}">F</span>
      <span class="nav-profile-copy"><b th:text="#{nav.hi_prefix} + ${farmer.username}">Hi, Farmer</b><small th:text="${farmer.district + ', ' + farmer.state}">Your location</small></span>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button" th:aria-label="#{nav.theme.dark}" th:title="#{nav.theme.dark}"><i data-lucide="moon"></i></button>
    <form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="nav-logout" type="submit"><i data-lucide="log-out"></i><span th:text="#{nav.sign_out}">Sign out</span></button></form>
  </div>
</nav>
