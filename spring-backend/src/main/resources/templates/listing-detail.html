<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harvest listing · KisanMitra</title><link rel="stylesheet" href="/css/app.css"><script src="https://unpkg.com/lucide@latest"></script></head><body><div th:replace="~{fragments/nav :: nav(${farmer},'marketplace')}"></div><main class="page-wrap narrow-wrap"><a class="back-link" href="/marketplace"><i data-lucide="arrow-left"></i> Back to local listings</a><section class="detail-card"><div class="detail-image"><img th:src="${listing.imagePath != null and !listing.imagePath.isBlank() ? listing.imagePath : '/assets/' + #strings.toLowerCase(listing.cropName).replace(' ','-') + '.png'}" onerror="this.onerror=null;this.src='/assets/crop-placeholder.png'" th:alt="${listing.cropName}"></div><div class="detail-copy"><span class="status-pill" th:text="${listing.status}">ACTIVE</span><p class="eyebrow" th:text="${listing.locationDistrict + ' · ' + listing.locationState}">Location</p><h1 th:text="${listing.cropName}">Crop</h1><p class="detail-price" th:text="${'₹' + #numbers.formatDecimal(listing.pricePerKg,1,2) + ' per kg'}">Price</p><p class="detail-quantity" th:text="${#numbers.formatDecimal(listing.quantityKg,1,0) + ' kg available'}">Quantity</p><p class="description" th:text="${listing.description ?: 'Contact the farmer for harvest and pickup details.'}">Details</p><div class="seller-card"><span class="module-icon"><i data-lucide="user-round"></i></span><div><small>CONTACT THE FARMER</small><b th:text="${listing.sellerName}">Seller</b><a th:href="${'tel:' + listing.sellerContact}" th:text="${listing.sellerContact}">Contact</a></div></div><form th:if="${isOwner and listing.status.name() == 'ACTIVE'}" method="post" th:action="@{'/marketplace/' + ${listing.id} + '/sold'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button button-outline">Mark as sold</button></form><aside class="notice market-note"><i data-lucide="handshake"></i><span>KisanMitra does not handle payments. Contact the farmer directly to buy from their field/home.</span></aside></div></section></main><script>lucide.createIcons()</script></body></html>
